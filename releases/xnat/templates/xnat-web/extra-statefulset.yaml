{{/*
Additional StatefulSet defined under xnat-web.shadowNodes, e.g. a
shadow server dedicated for large uploads, or a separate statefulet for another
piece of functionality.
*/}}
{{- $checksumConfigmap := (include (print .Template.BasePath "/xnat-web/configmap.yaml") . | sha256sum) -}}
{{- $checksumSecret := (include (print .Template.BasePath "/xnat-web/secret.yaml") . | sha256sum) -}}
{{- with (index .Values "xnat-web") -}}
{{- $values := . -}}
{{- range .shadowNodes }}
{{- $group := . -}}
{{- $groupName := .name -}}
{{- $replicas := $group.replicaCount | default 1 -}}
{{- $resources := default $values.resources $group.resources -}}
{{- $nodeSelector := default $values.nodeSelector $group.nodeSelector -}}
{{- $tolerations := default $values.tolerations $group.tolerations -}}
{{- $affinity := default $values.affinity $group.affinity -}}
{{- $extraVolumes := default $values.extraVolumes $group.extraVolumes -}}
{{- $extraVolumeMounts := default $values.extraVolumeMounts $group.extraVolumeMounts -}}
{{- $groupProbes := default dict $group.probes -}}
{{- $startupProbe := mergeOverwrite (deepCopy (default dict $values.probes.startup)) (default dict $groupProbes.startup) -}}
{{- $livenessProbe := mergeOverwrite (deepCopy (default dict $values.probes.liveness)) (default dict $groupProbes.liveness) -}}
{{- $readinessProbe := mergeOverwrite (deepCopy (default dict $values.probes.readiness)) (default dict $groupProbes.readiness) -}}
{{- $name := printf "%s-%s" (include "xnat-web.fullname" $) $groupName }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "xnat-web.labels" $ | nindent 4 }}
    role: {{ $groupName }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "xnat-web.statefulsetLabels" $ | nindent 6 }}
      role: {{ $groupName }}
  serviceName: {{ $name }}
  template:
    metadata:
      annotations:
        {{- with $values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/configmap: {{ $checksumConfigmap }}
        checksum/secret: {{ $checksumSecret }}
      labels:
        {{- include "xnat-web.statefulsetLabels" $ | nindent 8 }}
        role: {{ $groupName }}
    spec:
      {{- with $values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "xnat-web.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}
          securityContext:
            {{- toYaml $values.securityContext | nindent 12 }}
          image: "{{ $values.image.repository }}:{{ $values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $values.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ $values.timezone }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            {{- toYaml $livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml $startupProbe | nindent 12 }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - mountPath: /etc/passwd
              name: passwd
              readOnly: true
              subPath: passwd
            - mountPath: /usr/local/tomcat
              name: tomcat
            - mountPath: /usr/local/tomcat/conf/Catalina
              name: conf-catalina
            - mountPath: /data/xnat/home
              name: xnat-home
            - mountPath: /data/xnat/home/config
              name: xnat-home-config
              readOnly: true
            - mountPath: /data/xnat/home/plugins
              name: xnat-home-plugins
            {{- range $name, $c := $values.persistence }}
            {{- if $c.size }}
            - mountPath: {{ $c.mountPath | quote }}
              name: {{ $name | quote }}
            {{- end }}
            {{- end }}
            {{- $fileStorePath := $values.fileStorePath -}}
            {{- range $name, $c := $values.volumes }}
            {{- if $c.size }}
            - mountPath: {{ $c.mountPath | default $fileStorePath | quote }}
              name: {{ $name }}
              {{- if $c.mountPropagation }}
              mountPropagation: {{ $c.mountPropagation | default "None" | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- with $extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - name: plugin-logs
          securityContext:
            {{- toYaml $values.securityContext | nindent 12 }}
          image: debian:bullseye-slim
          imagePullPolicy: {{ $values.image.pullPolicy }}
          command: [bash, -c]
          args:
            - |
              # wait for logs to appear
              until [[ -d /data/xnat/home/logs && $(ls -A /data/xnat/home/logs) ]]; do
                sleep 5
              done
              sleep 30
              # Display logs to stdout
              for f in /data/xnat/home/logs/*.log; do
                tail -F "${f}" &
              done
              wait
          volumeMounts:
            - name: xnat-home
              mountPath: /data/xnat/home
              readOnly: true
      initContainers:
        - name: config
          image: ghcr.io/sydneyresearchtech/debian
          command: [bash, -c]
          args:
            - |
              set -x
              PGJDBCURI="jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}"
              export PGJDBCURI
              # Popluate and merge Secrets for config
              for f in /k8s_config/*; do
                file="$(basename ${f})"
                envsubst < "${f}" > "/data/xnat/home/config/${file}"
              done
              # Popluate and merge Secrets for plugins and auth plugins
              mkdir -p /data/xnat/home/config/auth
              for f in /k8s_plugins/*; do
                file="$(basename ${f})"
                DEST="/data/xnat/home/plugins"
                grep -q '^auth.method=' "${f}" && \
                  DEST="/data/xnat/home/config/auth"
                envsubst < "${f}" > "${DEST}/${file}"
              done
              # Wait for the postgresql database to be ready
              which pg_isready &>/dev/null && \
                until pg_isready --quiet; do sleep 5; done
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PGDATABASE
              {{- (include "xnat.postgresql.database" $) | nindent 14 }}
            - name: PGHOST
              {{- (include "xnat.postgresql.host" $) | nindent 14 }}
            - name: PGPASSWORD
              {{- (include "xnat.postgresql.password" $) | nindent 14 }}
            - name: PGPORT
              {{- (include "xnat.postgresql.port" $) | nindent 14 }}
            - name: PGUSER
              {{- (include "xnat.postgresql.user" $) | nindent 14 }}
            - name: XNAT_ADMIN_CREDS
              valueFrom:
                secretKeyRef:
                  name: {{ include "xnat-web.fullname" $ }}-admin
                  key: password
            {{- range $values.pluginSecrets }}
            {{- $secretName := .existingSecret -}}
            {{- range .secretKeys }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
          securityContext:
            {{- toYaml $values.securityContext | nindent 12 }}
          volumeMounts:
            - mountPath: /data/xnat/home/config
              name: xnat-home-config
            - mountPath: /data/xnat/home/plugins
              name: xnat-home-plugins
            - mountPath: /k8s_config
              name: conf-xnat
              readOnly: true
            - mountPath: /k8s_plugins
              name: conf-plugins
              readOnly: true
        - name: home
          image: "{{ $values.image.repository }}:{{ $values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $values.image.pullPolicy }}
          command: [bash, -c]
          args:
            - |
              set -x
              shopt -s extglob
              plugins=( {{ join " " (keys $values.plugins) }} )
              # Copy Tomcat folder
              cp -r --preserve=mode,timestamps --update=none /usr/local/tomcat/* /TOMCAT
              # Copy XNAT_HOME directory excluding the plugins folder
              cp -r --preserve=mode,timestamps --update=none ${XNAT_HOME}/!(plugins) /XNAT_HOME
              # Copy plugins that are configured in values.yml
              for plugin in ${plugins[@]}; do
                cp -r --preserve=mode,timestamps --update=none ${XNAT_HOME}/plugins/${plugin}-* /XNAT_HOME_PLUGINS || true
              done
          securityContext:
            {{- toYaml $values.securityContext | nindent 12 }}
          volumeMounts:
            - mountPath: /TOMCAT
              name: tomcat
            - mountPath: /XNAT_HOME
              name: xnat-home
            - mountPath: /XNAT_HOME_PLUGINS
              name: xnat-home-plugins
      volumes:
        - name: passwd
          configMap:
            name: {{ include "xnat-web.fullname" $ }}
            items:
              - key: passwd
                path: passwd
        - name: tomcat
          emptyDir: {}
        # SEVERE: Unable to create directory for deployment: [/usr/local/tomcat/conf/Catalina/localhost]
        - name: conf-catalina
          emptyDir: {}
        - name: xnat-home
          emptyDir: {}
        - name: xnat-home-config
          emptyDir: {}
        - name: xnat-home-plugins
          emptyDir: {}
        - name: conf-plugins
          configMap:
            name: {{ include "xnat-web.fullname" $ }}-plugins
        - name: conf-xnat
          configMap:
            name: {{ include "xnat-web.fullname" $ }}-config
        {{- range $name, $c := $values.volumes }}
        {{- if $c.size }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $c.existingClaim | default (printf "%s-%s" (include "xnat-web.fullname" $) $name) }}
        {{- end }}
        {{- end }}
        {{- with $extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    {{- range $name, $c := $values.persistence }}
    {{- if not $c.existingClaim }}
    {{- if $c.size }}
    - metadata:
        name: {{ $name | quote }}
      spec:
        accessModes: [ {{ $c.accessMode | quote }} ]
        {{ include "xnat.storageClassName" (dict "vol" $c "global" $.Values.global) }}
        volumeMode: Filesystem
        resources:
          requests:
            storage: {{ $c.size }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
