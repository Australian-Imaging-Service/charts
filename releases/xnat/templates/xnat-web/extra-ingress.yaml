{{- with (index .Values "xnat-web") -}}
{{- $xnatWeb := . -}}
{{- range .shadowNodes }}
{{- $group := . -}}
{{- $groupName := .name }}
{{- if ($group.ingress).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "xnat-web.fullname" $ }}-{{ $groupName }}
  labels:
    {{- include "xnat-web.labels" $ | nindent 4 }}
  {{- with $group.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $group.ingress.ingressClassName }}
  ingressClassName: {{ $group.ingress.ingressClassName }}
  {{- end }}
  {{- if $group.ingress.tls }}
  tls:
    {{- range $group.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $group.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ include "xnat-web.fullname" $ }}-{{ $groupName }}
                port:
                  number: {{ $xnatWeb.service.port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
