suite: pipeline reconciler
templates:
  - xnat-web/pipeline-reconciler.yaml
tests:
  - it: should render nothing by default
    asserts:
      - hasDocuments:
          count: 0
  - it: should require an image tag when enabled
    set:
      xnat-web.pipelineReconciler.enabled: true
      xnat-web.pipelineReconciler.image.tag: ""
    asserts:
      - failedTemplate:
          errorMessage: xnat-web.pipelineReconciler.image.tag is required when the pipeline reconciler is enabled
  - it: should require an existing credentials secret when enabled
    set:
      xnat-web.pipelineReconciler.enabled: true
      xnat-web.pipelineReconciler.image.tag: test
    asserts:
      - failedTemplate:
          errorMessage: "xnat-web.pipelineReconciler.existingSecret is required when the pipeline reconciler is enabled (keys: XNAT_USER and XNAT_PASS)"
  - it: should serialize reconciler configuration
    set:
      xnat-web.pipelineReconciler.enabled: true
      xnat-web.pipelineReconciler.image.tag: test
      xnat-web.pipelineReconciler.existingSecret: reconciler-auth
      xnat-web.pipelineReconciler.config:
        include: ["test/*"]
        exclude: ["test/experimental"]
        enablement: approval
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data["config.yaml"]
          value: |
            enablement: approval
            exclude:
            - test/experimental
            include:
            - test/*
  - it: should render a weekly non-root job using the XNAT service and secret
    set:
      xnat-web.pipelineReconciler.enabled: true
      xnat-web.pipelineReconciler.image.tag: test
      xnat-web.pipelineReconciler.existingSecret: reconciler-auth
    documentIndex: 1
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: apiVersion
          value: batch/v1
      - equal:
          path: spec.schedule
          value: "0 2 * * 0"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext
          value:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/name"]
          value: RELEASE-NAME-xnat-web-pipeline-reconciler
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: ghcr.io/australian-imaging-service/pipelines-reconciler:test
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          value:
            - name: XNAT_HOST
              value: http://RELEASE-NAME-xnat-web:80
            - name: XNAT_USER
              valueFrom:
                secretKeyRef:
                  name: reconciler-auth
                  key: XNAT_USER
            - name: XNAT_PASS
              valueFrom:
                secretKeyRef:
                  name: reconciler-auth
                  key: XNAT_PASS
            - name: PIPELINE_RECONCILER_CONFIG
              value: /etc/pipeline-reconciler/config.yaml
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].configMap.name
          value: RELEASE-NAME-xnat-web-pipeline-reconciler
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[0]
          value:
            name: config
            mountPath: /etc/pipeline-reconciler
            readOnly: true
  - it: should support service naming and port overrides
    set:
      xnat-web.fullnameOverride: custom-xnat
      xnat-web.service.port: 8080
      xnat-web.pipelineReconciler.enabled: true
      xnat-web.pipelineReconciler.image.tag: test
      xnat-web.pipelineReconciler.existingSecret: reconciler-auth
    documentIndex: 1
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].value
          value: http://custom-xnat:8080
  - it: should support host and schedule overrides and image pull secrets
    set:
      xnat-web.pipelineReconciler.enabled: true
      xnat-web.pipelineReconciler.image.tag: test
      xnat-web.pipelineReconciler.existingSecret: reconciler-auth
      xnat-web.pipelineReconciler.xnatHost: https://xnat.example.org
      xnat-web.pipelineReconciler.schedule: "0 4 * * 1"
      xnat-web.imagePullSecrets:
        - name: registry-auth
    documentIndex: 1
    asserts:
      - equal:
          path: spec.schedule
          value: "0 4 * * 1"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0].value
          value: https://xnat.example.org
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets
          value:
            - name: registry-auth
  - it: should keep long CronJob names within the 52 character limit
    set:
      xnat-web.fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      xnat-web.pipelineReconciler.enabled: true
      xnat-web.pipelineReconciler.image.tag: test
      xnat-web.pipelineReconciler.existingSecret: reconciler-auth
    documentIndex: 1
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^[a-z0-9-]{1,52}$
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-pipeline-reconciler
