{{- if and .Values.cvmfs.enabled .Values.cvmfs.probe.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cvmfs-probe-script
  namespace: {{ include "neurodesk.namespace" . }}
  labels:
    app: cvmfs-probe
    {{- include "neurodesk.labels" . | nindent 4 }}
data:
  probe.py: |
    #!/usr/bin/env python3
    import os, time, threading
    from http.server import BaseHTTPRequestHandler, HTTPServer

    REPOS = [r for r in os.environ.get("CVMFS_REPOS", "neurodesk.ardc.edu.au").split(",") if r]
    NODE = os.environ.get("NODE_NAME", "unknown")
    INTERVAL = int(os.environ.get("PROBE_INTERVAL_SECONDS", "30"))
    MOUNT = os.environ.get("CVMFS_MOUNT", "/cvmfs")

    state = {repo: 0 for repo in REPOS}
    last_check_ts = {repo: 0.0 for repo in REPOS}

    def log(msg):
        print("[%s] %s" % (time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), msg), flush=True)

    def probe(repo):
        # listdir on the autofs-managed /cvmfs/<repo> triggers a mount on first
        # access and surfaces ENOTCONN if the cvmfs2 daemon backing the FUSE
        # has died. We rely on the CVMFS CSI volume mount in this pod, which
        # gives the same view of /cvmfs that user pods have (hostPath does NOT
        # — it bind-mounts the underlying directory inode, missing the autofs
        # and FUSE layers stacked on top).
        try:
            os.listdir(os.path.join(MOUNT, repo))
            return True
        except OSError as e:
            log("probe: FAIL /cvmfs/%s errno=%d (%s)" % (repo, e.errno, e.strerror))
            return False

    def probe_loop():
        while True:
            for repo in REPOS:
                state[repo] = 1 if probe(repo) else 0
                last_check_ts[repo] = time.time()
            time.sleep(INTERVAL)

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, *_): pass
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404); self.end_headers(); return
            # NOTE: do NOT use Python f-strings here — emitting a literal
            # opening brace from an f-string requires doubling it, but doubled
            # braces collide with Helm template directives. %-formatting keeps
            # the source single-brace so Helm leaves it alone.
            lines = [
                "# HELP cvmfs_mount_healthy 1 if /cvmfs/<repo> is accessible, 0 otherwise.",
                "# TYPE cvmfs_mount_healthy gauge",
            ]
            for repo, v in state.items():
                lines.append('cvmfs_mount_healthy{repo="%s",node="%s"} %d' % (repo, NODE, v))
            lines += [
                "# HELP cvmfs_mount_last_probe_timestamp_seconds Unix timestamp of the most recent probe.",
                "# TYPE cvmfs_mount_last_probe_timestamp_seconds gauge",
            ]
            for repo, ts in last_check_ts.items():
                lines.append('cvmfs_mount_last_probe_timestamp_seconds{repo="%s",node="%s"} %f' % (repo, NODE, ts))
            body = ("\n".join(lines) + "\n").encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

    if __name__ == "__main__":
        log("starting cvmfs-probe (detection-only): repos=%s node=%s mount=%s interval=%ss" % (REPOS, NODE, MOUNT, INTERVAL))
        threading.Thread(target=probe_loop, daemon=True).start()
        HTTPServer(("0.0.0.0", 9100), Handler).serve_forever()
{{- end }}
