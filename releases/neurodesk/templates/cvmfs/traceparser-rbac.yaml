{{- if and .Values.cvmfs.enabled .Values.cvmfs.traceParser.enabled }}
# The parser shells out to `kubectl exec` against the cvmfs-csi nodeplugin pods
# to flush/read trace buffers, so it needs get/list/create on pods + pods/exec
# within the release namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cvmfs-file-retriever
  namespace: {{ include "neurodesk.namespace" . }}
  labels:
    app: cvmfs-trace-parser
    {{- include "neurodesk.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cvmfs-file-retriever
  namespace: {{ include "neurodesk.namespace" . }}
  labels:
    app: cvmfs-trace-parser
    {{- include "neurodesk.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cvmfs-file-retriever
  namespace: {{ include "neurodesk.namespace" . }}
  labels:
    app: cvmfs-trace-parser
    {{- include "neurodesk.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: cvmfs-file-retriever
  namespace: {{ include "neurodesk.namespace" . }}
roleRef:
  kind: Role
  name: cvmfs-file-retriever
  apiGroup: rbac.authorization.k8s.io
{{- end }}
