{{- if and .Values.cvmfs.enabled .Values.global.cvmfs.squidEnabled }}
# Service name MUST stay "cvmfs-squid" — the neurodesk.cvmfsHttpProxy helper and
# the cvmfs-csi default.local CONFIGMAP both target this DNS name on :3128.
apiVersion: v1
kind: Service
metadata:
  name: cvmfs-squid
  namespace: {{ include "neurodesk.namespace" . }}
  labels:
    app: cvmfs-squid
    {{- include "neurodesk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: cvmfs-squid
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
      protocol: TCP
{{- end }}
