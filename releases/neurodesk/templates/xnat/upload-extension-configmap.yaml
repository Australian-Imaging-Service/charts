        .file-format.NIFTI { background: #4caf50; }
        .file-format.DICOM { background: #2196f3; }
        .file-format.ANALYZE { background: #8bc34a; }
        .file-format.CSV, .file-format.TSV { background: #ff9800; }
        .file-format.JSON { background: #ffc107; color: #333; }
        .file-format.ZIP, .file-format.TAR { background: #9c27b0; }
        .breadcrumbs { font-size: 13px; margin-bottom: 8px; color: #666; }
        .breadcrumbs span { cursor: pointer; color: #1976d2; }
        .breadcrumbs span:hover { text-decoration: underline; }
        .row { display: flex; gap: 12px; }
        .row > * { flex: 1; }
        .results { margin-top: 16px; }
        .result-item { padding: 8px 12px; margin-bottom: 4px; border-radius: 4px; font-size: 13px; }
        .result-item.success { background: #e8f5e9; }
        .result-item.failed { background: #ffebee; }
        .hidden { display: none; }
        .help { font-size: 12px; color: #666; margin-top: 4px; }
        .quick-access { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .quick-label { font-size: 13px; color: #666; }
        .btn-small { padding: 4px 10px; font-size: 12px; background: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        .btn-small:hover { background: #bbdefb; }
        .btn-small.active { background: #1976d2; color: white; border-color: #1976d2; }
        .manual-path { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
        .selected-files-section { margin-top: 12px; }
        .selected-files-list { max-height: 150px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; }
        .selected-files-list:empty { display: none; }
        .collision-warn { margin: 8px 0; padding: 8px 10px; border-radius: 4px; background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; font-size: 12px; }
        .collision-warn:empty { display: none; }
        .selected-file-item { display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 12px; gap: 8px; }
        .selected-file-item:last-child { border-bottom: none; }
        .selected-file-item .file-path { flex: 1; word-break: break-all; color: #333; }
        .selected-file-item .remove-btn { background: #ffebee; color: #c62828; border: none; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }
        .selected-file-item .remove-btn:hover { background: #ffcdd2; }
        .btn-clear { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .btn-clear:hover { background: #ffe0b2; }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>XNAT Upload</h1>
        <p class="subtitle">Upload files from JupyterHub to XNAT</p>

        <div class="section" id="auth-section">
          <h2>1. Authentication</h2>
          <label>Alias Token</label>
          <input type="text" id="alias" placeholder="Enter your XNAT alias token">
          <label>Secret</label>
          <input type="password" id="secret" placeholder="Enter your secret">
          <button class="btn btn-primary" onclick="authenticate()">Connect to XNAT</button>
          <div id="auth-status"></div>
        </div>

        <div class="section hidden" id="project-section">
          <h2>2. Select Project & Location</h2>
          <select id="project-select"><option value="">Loading projects...</option></select>
          <div class="row">
            <div><label>Subject ID</label><input type="text" id="subject-id" placeholder="e.g., SUBJ001"></div>
            <div><label>Session ID</label><input type="text" id="session-id" placeholder="e.g., SESS001"></div>
          </div>
          <div class="row">
            <div>
              <label>Modality</label>
              <select id="session-type">
                <option value="MR">MR (MRI)</option>
                <option value="CT">CT</option>
                <option value="PET">PET</option>
              </select>
            </div>
            <div><label>Scan ID</label><input type="text" id="scan-id" placeholder="e.g., 1, SCAN01"><p class="help">Leave empty for session-level</p></div>
          </div>
          <div class="row">
            <div><label>Scan Type</label><input type="text" id="scan-type" placeholder="e.g., T1, T2, FLAIR"></div>
            <div><label>Resource Label</label><input type="text" id="resource-label" value="FILES" placeholder="e.g., FILES, NIFTI"></div>
          </div>
        </div>

        <div class="section hidden" id="files-section">
          <h2>3. Select Files</h2>
          <div class="quick-access" id="quick-access"><span class="quick-label">Browse:</span></div>
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="file-list" id="file-list"></div>
          <div class="manual-path">
            <label>Or enter path manually:</label>
            <div style="display:flex;gap:8px">
              <input type="text" id="manual-path" placeholder="/neurodesktop-storage/path/to/file.nii.gz" style="flex:1;margin-bottom:0">
              <button class="btn btn-primary" onclick="addManualPath()">Add</button>
            </div>
          </div>
          <div class="selected-files-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <label><span id="selected-count">0</span> file(s) selected</label>
              <button class="btn btn-small btn-clear" onclick="clearAllFiles()" id="clear-all-btn" style="display:none">Clear All</button>
            </div>
            <div class="collision-warn" id="collision-warn"></div>
            <div class="selected-files-list" id="selected-files-list"></div>
          </div>
        </div>

        <div class="section hidden" id="upload-section">
          <h2>4. Upload</h2>
          <button class="btn btn-success" id="upload-btn" onclick="uploadFiles()">Upload Selected Files</button>
          <button class="btn btn-danger" onclick="disconnect()">Disconnect</button>
          <div class="results" id="results"></div>
        </div>
      </div>

      <script>
        let currentPath = "";
        let selectedFiles = new Set();
        let allowedRoots = [];
        let homeDir = "";

        // HTML-escape anything interpolated into markup. Filenames are attacker-influenced
        // on shared mounts (/data, /neurodesktop-storage).
        function esc(s) {
          return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }
        const baseUrl = window.location.pathname.replace(/\\/$/, "");

        async function api(endpoint, method = "GET", body = null) {
          const opts = { method, headers: { "Content-Type": "application/json" } };
          if (body) opts.body = JSON.stringify(body);
          const res = await fetch(baseUrl + "/api/" + endpoint, opts);
          return res.json();
        }

        async function authenticate() {
          const alias = document.getElementById("alias").value;
          const secret = document.getElementById("secret").value;
          if (!alias || !secret) return showStatus("auth-status", "Please enter alias and secret", "error");
          showStatus("auth-status", "Connecting...", "info");
          const res = await api("auth", "POST", { alias, secret });
          if (res.valid) {
            showStatus("auth-status", "Connected as: " + res.username, "success");
            document.getElementById("project-section").classList.remove("hidden");
            document.getElementById("files-section").classList.remove("hidden");
            document.getElementById("upload-section").classList.remove("hidden");
            loadProjects();
            loadFiles("");
          } else {
            showStatus("auth-status", "Failed: " + res.error, "error");
          }
        }

        async function loadProjects() {
          const res = await api("projects");
          const select = document.getElementById("project-select");
          if (res.projects) {
            select.innerHTML = "<option value=''>-- Select Project --</option>" +
              res.projects.map(p => "<option value='" + p.id + "'>" + p.id + " - " + p.name + (p.role ? " (" + p.role + ")" : "") + "</option>").join("");
          }
        }

        async function loadFiles(path) {
          const res = await api("files?path=" + encodeURIComponent(path));
          if (res.error) return alert(res.error);
          if (res.home) homeDir = res.home;
          if (res.path) path = res.path;      // trust the server's resolved absolute path
          currentPath = path;

          const list = document.getElementById("file-list");
          const crumbs = document.getElementById("breadcrumbs");
          const quickAccess = document.getElementById("quick-access");

          if (res.allowed_roots) {
            allowedRoots = res.allowed_roots;
            let qaHtml = '<span class="quick-label">Browse:</span>';
            allowedRoots.filter(r => r !== '/tmp').forEach(root => {
              const active = (currentPath === root || currentPath.indexOf(root + '/') === 0) ? ' active' : '';
              const label = (root === homeDir) ? 'Home' : root.replace(/^\\//, '');
              qaHtml += '<button class="btn btn-small' + active + '" data-path="' + esc(root) + '" onclick="loadFiles(this.dataset.path)">' + esc(label) + '</button>';
            });
            quickAccess.innerHTML = qaHtml;
          }

          // ONE breadcrumb renderer. Paths are always absolute, so crumbs are just the real
          // path segments - there is no hardcoded label left to double up.
          const parts = path.split("/").filter(p => p);
          crumbs.innerHTML = parts.map((p, i) => {
            const upto = "/" + parts.slice(0, i + 1).join("/");
            return '<span data-path="' + esc(upto) + '" onclick="loadFiles(this.dataset.path)">' + esc(p) + '</span>';
          }).join(" / ");

          const inAllowed = (q) => allowedRoots.some(r => q === r || q.indexOf(r + '/') === 0);
          let html = "";
          const parentPath = "/" + parts.slice(0, -1).join("/");
          if (path && allowedRoots.indexOf(path) === -1 && inAllowed(parentPath)) {
            html = '<div class="file-item dir" data-path="' + esc(parentPath) + '" onclick="loadFiles(this.dataset.path)">📁 ..</div>';
          }

          if (res.files) {
            res.files.filter(f => f.type === "directory").forEach(f => {
              html += '<div class="file-item dir" data-path="' + esc(f.path) + '" onclick="loadFiles(this.dataset.path)">📁 <span class="file-name">' + esc(f.name) + '</span></div>';
            });
            res.files.filter(f => f.type === "file").forEach(f => {
              const checked = selectedFiles.has(f.path) ? "checked" : "";
              const size = f.size > 1048576 ? (f.size / 1048576).toFixed(1) + " MB" : (f.size / 1024).toFixed(1) + " KB";
              const fmt = f.format || "OTHER";
              html += '<div class="file-item"><input type="checkbox" ' + checked + ' data-path="' + esc(f.path) + '" onchange="toggleFile(this)">📄 <span class="file-name">' + esc(f.name) + '</span><span class="file-format ' + esc(fmt) + '">' + esc(fmt) + '</span><span class="file-meta">' + size + '</span></div>';
            });
          }
          list.innerHTML = html || "<div class='file-item'>No files</div>";
        }

        function toggleFile(el) {
          const path = el.dataset.path;
          if (el.checked) selectedFiles.add(path); else selectedFiles.delete(path);
          updateSelectedFilesList();
        }

        function addManualPath() {
          const input = document.getElementById("manual-path");
          const path = input.value.trim();
          if (path) { selectedFiles.add(path); input.value = ""; updateSelectedFilesList(); }
        }

        function removeFile(path) {
          selectedFiles.delete(path);
          const cb = document.querySelector('input[data-path="' + path + '"]');
          if (cb) cb.checked = false;
          updateSelectedFilesList();
        }

        function clearAllFiles() {
          selectedFiles.clear();
          document.querySelectorAll('#file-list input[type="checkbox"]').forEach(cb => cb.checked = false);
          updateSelectedFilesList();
        }

        function updateSelectedFilesList() {
          const count = selectedFiles.size;
          document.getElementById("selected-count").textContent = count;
          document.getElementById("clear-all-btn").style.display = count > 0 ? "inline-block" : "none";
          const listEl = document.getElementById("selected-files-list");

          // Live name-clash warning. XNAT stores files by name inside a resource, so two
          // selected files sharing a basename collide. Recomputed on every selection change,
          // so it appears and clears itself as you tick/untick.
          const warnEl = document.getElementById("collision-warn");
          const byName = {};
          selectedFiles.forEach(p => {
            const n = p.split("/").pop();
            if (!byName[n]) byName[n] = [];
            byName[n].push(p);
          });
          const clashes = Object.keys(byName).filter(n => byName[n].length > 1);
          warnEl.innerHTML = clashes.length
            ? '<strong>Name clash:</strong> XNAT stores files by name, so only one copy of ' +
              clashes.map(esc).join(", ") + ' can be kept. Unselect one of each.'
            : "";

          if (count === 0) { listEl.innerHTML = ""; return; }
          let html = "";
          selectedFiles.forEach(path => {
            const fileName = path.split("/").pop();
            html += '<div class="selected-file-item"><span class="file-path" title="' + esc(path) + '">' + esc(fileName) + '</span><button class="remove-btn" data-path="' + esc(path) + '" onclick="removeFile(this.dataset.path)">Remove</button></div>';
          });
          listEl.innerHTML = html;
        }

        async function uploadFiles() {
          const project = document.getElementById("project-select").value;
          if (!project) return alert("Please select a project");
          if (selectedFiles.size === 0) return alert("Please select files");
          const btn = document.getElementById("upload-btn");
          btn.disabled = true; btn.textContent = "Uploading...";

          const res = await api("upload", "POST", {
            files: Array.from(selectedFiles),
            project_id: project,
            subject_id: document.getElementById("subject-id").value,
            session_id: document.getElementById("session-id").value,
            scan_id: document.getElementById("scan-id").value,
            session_type: document.getElementById("session-type").value,
            scan_type: document.getElementById("scan-type").value,
            resource_label: document.getElementById("resource-label").value || "FILES"
          });

          btn.disabled = false; btn.textContent = "Upload Selected Files";
          const results = document.getElementById("results");
          if (res.results) {
            results.innerHTML = "<h3>Results: " + res.summary.success + "/" + res.summary.total + " successful</h3>" +
              res.results.map(r => "<div class='result-item " + r.status + "'>" + (r.status === "success" ? "✓" : "✗") + " " + r.file + (r.error ? " - " + r.error : "") + "</div>").join("");
            if (res.summary.failed === 0) { selectedFiles.clear(); updateSelectedFilesList(); }
            loadFiles(currentPath);
          } else {
            results.innerHTML = "<div class='status error'>" + (res.error || "Upload failed") + "</div>";
          }
        }

        async function disconnect() {
          await api("disconnect", "POST");
          location.reload();
        }

        function showStatus(id, msg, type) {
          document.getElementById(id).innerHTML = "<div class='status " + type + "'>" + msg + "</div>";
        }
      </script>
    </body>
    </html>'''
            self.send_response(200)
            self.send_header('Content-Type', 'text/html')
            self.end_headers()
            self.wfile.write(html.encode())

    if __name__ == '__main__':
        parser = argparse.ArgumentParser()
        parser.add_argument('--port', type=int, default=DEFAULT_PORT)
        args = parser.parse_args()
        os.chdir(Path.home())
        print(f"XNAT Upload Server starting on port {args.port}")
        ThreadingHTTPServer(('0.0.0.0', args.port), XNATHandler).serve_forever()
