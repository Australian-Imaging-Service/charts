        .btn-small:hover { background: #bbdefb; }
        .btn-small.active { background: #1976d2; color: white; border-color: #1976d2; }
        .manual-path { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
        .manual-path label { margin-bottom: 6px; }
        .selected-files-section { margin-top: 12px; }
        .selected-files-list { max-height: 150px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; }
        .selected-files-list:empty { display: none; }
        .selected-file-item { display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 12px; gap: 8px; }
        .selected-file-item:last-child { border-bottom: none; }
        .selected-file-item .file-path { flex: 1; word-break: break-all; color: #333; }
        .selected-file-item .remove-btn { background: #ffebee; color: #c62828; border: none; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 11px; }
        .selected-file-item .remove-btn:hover { background: #ffcdd2; }
        .btn-clear { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .btn-clear:hover { background: #ffe0b2; }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>XNAT Upload</h1>
        <p class="subtitle">Upload files from JupyterHub to XNAT</p>

        <!-- Auth Section -->
        <div class="section" id="auth-section">
          <h2>1. Authentication</h2>
          <div id="auth-form">
            <label>Alias Token</label>
            <input type="text" id="alias" placeholder="Enter your XNAT alias token">
            <label>Secret</label>
            <input type="password" id="secret" placeholder="Enter your secret">
            <button class="btn btn-primary" onclick="authenticate()">Connect to XNAT</button>
          </div>
          <div id="auth-status"></div>
        </div>

        <!-- Project Section -->
        <div class="section hidden" id="project-section">
          <h2>2. Select Project & Location</h2>
          <select id="project-select"><option value="">Loading projects...</option></select>
          <div class="row">
            <div><label>Subject ID</label><input type="text" id="subject-id" placeholder="e.g., SUBJ001"></div>
            <div><label>Session ID</label><input type="text" id="session-id" placeholder="e.g., SESS001"></div>
          </div>
          <div class="row">
            <div>
              <label>Modality</label>
              <select id="session-type">
                <option value="MR">MR (MRI)</option>
                <option value="CT">CT</option>
                <option value="PET">PET</option>
                <option value="US">Ultrasound</option>
                <option value="XA">X-Ray Angio</option>
                <option value="MG">Mammography</option>
                <option value="OPT">Optical</option>
              </select>
              <p class="help">Imaging modality for session</p>
            </div>
            <div><label>Scan ID</label><input type="text" id="scan-id" placeholder="e.g., 1, SCAN01"><p class="help">Leave empty for session-level upload</p></div>
          </div>
          <div class="row">
            <div><label>Scan Type</label><input type="text" id="scan-type" placeholder="e.g., T1, T2, FLAIR, DWI"><p class="help">Label describing the scan</p></div>
            <div><label>Resource Label</label><input type="text" id="resource-label" value="FILES" placeholder="e.g., FILES, NIFTI"><p class="help">Container name for files</p></div>
          </div>
          <p class="help" style="margin-top:8px"><strong>Hierarchy:</strong> Project → Subject → Session → Scan (leave fields empty for higher-level upload)</p>
        </div>

        <!-- Files Section -->
        <div class="section hidden" id="files-section">
          <h2>3. Select Files</h2>
          <div class="quick-access" id="quick-access">
            <span class="quick-label">Browse:</span>
            <button class="btn btn-small" onclick="loadFiles('', false)">Workspace</button>
          </div>
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="file-list" id="file-list"></div>
          <div class="manual-path">
            <label>Or enter path manually:</label>
            <div style="display:flex;gap:8px">
              <input type="text" id="manual-path" placeholder="/neurodesktop-storage/path/to/file.nii.gz" style="flex:1;margin-bottom:0">
              <button class="btn btn-primary" onclick="addManualPath()">Add</button>
            </div>
          </div>
          <div class="selected-files-section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <label><span id="selected-count">0</span> file(s) selected</label>
              <button class="btn btn-small btn-clear" onclick="clearAllFiles()" id="clear-all-btn" style="display:none">Clear All</button>
            </div>
            <div class="selected-files-list" id="selected-files-list"></div>
          </div>
        </div>

        <!-- Upload Section -->
        <div class="section hidden" id="upload-section">
          <h2>4. Upload</h2>
          <button class="btn btn-success" id="upload-btn" onclick="uploadFiles()">Upload Selected Files</button>
          <button class="btn btn-danger" onclick="disconnect()">Disconnect</button>
          <div class="results" id="results"></div>
        </div>
      </div>

      <script>
        let currentPath = "";
        let selectedFiles = new Set();
        let isAbsolute = false;
        let allowedRoots = [];
        let workspacePath = "";
        // Get base URL from current page location
        const baseUrl = window.location.pathname.replace(/\/ui\/?$/, "").replace(/\/?$/, "");

        function getXsrfToken() {
          const m = document.cookie.match(/(?:^|;\s*)_xsrf=([^;]*)/);
          return m ? decodeURIComponent(m[1]) : "";
        }

        async function api(endpoint, method = "GET", body = null) {
          const opts = { method, credentials: "same-origin", headers: { "Content-Type": "application/json", "X-XSRFToken": getXsrfToken() } };
          if (body) opts.body = JSON.stringify(body);
          const res = await fetch(baseUrl + "/" + endpoint, opts);
          return res.json();
        }

        async function authenticate() {
          const alias = document.getElementById("alias").value;
          const secret = document.getElementById("secret").value;
          if (!alias || !secret) return showStatus("auth-status", "Please enter alias and secret", "error");

          showStatus("auth-status", "Connecting...", "info");
          const res = await api("auth", "POST", { alias, secret });

          if (res.valid) {
            showStatus("auth-status", "Connected as: " + res.username, "success");
            document.getElementById("project-section").classList.remove("hidden");
            document.getElementById("files-section").classList.remove("hidden");
            document.getElementById("upload-section").classList.remove("hidden");
            loadProjects();
            loadFiles("", false);
          } else {
            showStatus("auth-status", "Failed: " + res.error, "error");
          }
        }

        async function loadProjects() {
          const res = await api("projects");
          const select = document.getElementById("project-select");
          if (res.projects) {
            select.innerHTML = "<option value=''>-- Select Project --</option>" +
              res.projects.map(p => "<option value='" + p.id + "'>" + p.id + " - " + p.name + "</option>").join("");
          }
        }

        async function loadFiles(pathOrEl, absolute = null) {
          var path;
          if (typeof pathOrEl === "string") {
            path = pathOrEl;
            if (absolute !== null) isAbsolute = absolute;
          } else if (pathOrEl && pathOrEl.dataset) {
            path = pathOrEl.dataset.path;
            if (pathOrEl.dataset.absolute !== undefined) isAbsolute = pathOrEl.dataset.absolute === "true";
          } else {
            path = "";
            isAbsolute = false;
          }
          currentPath = path;

          const queryParams = "path=" + encodeURIComponent(path) + (isAbsolute ? "&absolute=true" : "");
          const res = await api("files?" + queryParams);
          const list = document.getElementById("file-list");
          const crumbs = document.getElementById("breadcrumbs");
          const quickAccess = document.getElementById("quick-access");

          // Store workspace and allowed roots from response
          if (res.workspace) workspacePath = res.workspace;
          if (res.allowed_roots) {
            allowedRoots = res.allowed_roots;
            // Update quick access buttons
            let qaHtml = '<span class="quick-label">Browse:</span>';
            qaHtml += '<button class="btn btn-small' + (!isAbsolute ? ' active' : '') + '" onclick="loadFiles(\\'\\', false)">Workspace</button>';
            allowedRoots.filter(r => r !== '/workspace' && r !== '/tmp').forEach(root => {
              const active = isAbsolute && currentPath.startsWith(root) ? ' active' : '';
              qaHtml += '<button class="btn btn-small' + active + '" onclick="loadFiles(\\'' + root + '\\', true)">' + root.replace(/^\\//, '') + '</button>';
            });
            quickAccess.innerHTML = qaHtml;
          }

          // Breadcrumbs
          if (isAbsolute) {
            const parts = path.split("/").filter(p => p);
            crumbs.innerHTML = parts.map((p, i) => {
              var pth = "/" + parts.slice(0, i + 1).join("/");
              return '<span onclick="loadFiles(this)" data-path="' + pth + '" data-absolute="true">' + p + '</span>';
            }).join(" / ");
          } else {
            const parts = path.split("/").filter(p => p);
            crumbs.innerHTML = '<span onclick="loadFiles(this)" data-path="" data-absolute="false">workspace</span>' +
              parts.map((p, i) => {
                var pth = parts.slice(0, i + 1).join("/");
                return ' / <span onclick="loadFiles(this)" data-path="' + pth + '" data-absolute="false">' + p + '</span>';
              }).join("");
          }

          // File list
          let parentPath;
          if (isAbsolute) {
            const parts = path.split("/").filter(p => p);
            parentPath = parts.length > 1 ? "/" + parts.slice(0, -1).join("/") : "";
          } else {
            parentPath = path.split("/").slice(0, -1).join("/");
          }

          let html = "";
          if (path) {
            if (isAbsolute && parentPath) {
              html = '<div class="file-item dir" onclick="loadFiles(this)" data-path="' + parentPath + '" data-absolute="true">📁 ..</div>';
            } else if (!isAbsolute) {
              html = '<div class="file-item dir" onclick="loadFiles(this)" data-path="' + parentPath + '" data-absolute="false">📁 ..</div>';
            }
          }

          if (res.files) {
            res.files.filter(f => f.type === "directory").forEach(f => {
              html += '<div class="file-item dir" onclick="loadFiles(this)" data-path="' + f.path + '" data-absolute="' + isAbsolute + '">📁 <span class="file-name">' + f.name + '</span></div>';
            });
            res.files.filter(f => f.type === "file").forEach(f => {
              const checked = selectedFiles.has(f.path) ? "checked" : "";
              const size = f.size > 1048576 ? (f.size / 1048576).toFixed(1) + " MB" : (f.size / 1024).toFixed(1) + " KB";
              html += '<div class="file-item"><input type="checkbox" ' + checked + ' data-path="' + f.path + '" onchange="toggleFile(this)">' +
                '📄 <span class="file-name">' + f.name + '</span><span class="file-format ' + f.format + '">' + f.format + '</span><span class="file-meta">' + size + '</span></div>';
            });
          }
          list.innerHTML = html || "<div class='file-item'>No files</div>";
        }

        function addManualPath() {
          const input = document.getElementById("manual-path");
          const path = input.value.trim();
          if (!path) return;
          selectedFiles.add(path);
          input.value = "";
          updateSelectedFilesList();
        }

        function toggleFile(el) {
          var path = el.dataset.path;
          var checked = el.checked;
          if (checked) selectedFiles.add(path); else selectedFiles.delete(path);
          updateSelectedFilesList();
        }

        function removeFile(path) {
          selectedFiles.delete(path);
          // Uncheck checkbox if visible in file browser
          const checkbox = document.querySelector('input[data-path="' + path + '"]');
          if (checkbox) checkbox.checked = false;
          updateSelectedFilesList();
        }

        function clearAllFiles() {
          selectedFiles.clear();
          // Uncheck all checkboxes
          document.querySelectorAll('#file-list input[type="checkbox"]').forEach(cb => cb.checked = false);
          updateSelectedFilesList();
        }

        function updateSelectedFilesList() {
          const count = selectedFiles.size;
          document.getElementById("selected-count").textContent = count;
          const clearBtn = document.getElementById("clear-all-btn");
          clearBtn.style.display = count > 0 ? "inline-block" : "none";

          const listEl = document.getElementById("selected-files-list");
          if (count === 0) {
            listEl.innerHTML = "";
            return;
          }

          let html = "";
          Array.from(selectedFiles).forEach(path => {
            const fileName = path.split("/").pop();
            html += '<div class="selected-file-item">' +
              '<span class="file-path" title="' + path + '">' + fileName + '</span>' +
              '<button class="remove-btn" onclick="removeFile(\\'' + path.replace(/'/g, "\\\\'") + '\\')">Remove</button>' +
              '</div>';
          });
          listEl.innerHTML = html;
        }

        async function uploadFiles() {
          const project = document.getElementById("project-select").value;
          if (!project) return alert("Please select a project");
          if (selectedFiles.size === 0) return alert("Please select files");

          const btn = document.getElementById("upload-btn");
          btn.disabled = true;
          btn.textContent = "Uploading...";

          const res = await api("upload", "POST", {
            files: Array.from(selectedFiles),
            project_id: project,
            subject_id: document.getElementById("subject-id").value,
            session_id: document.getElementById("session-id").value,
            scan_id: document.getElementById("scan-id").value,
            session_type: document.getElementById("session-type").value,
            scan_type: document.getElementById("scan-type").value,
            resource_label: document.getElementById("resource-label").value || "FILES"
          });

          btn.disabled = false;
          btn.textContent = "Upload Selected Files";

          const results = document.getElementById("results");
          if (res.results) {
            results.innerHTML = "<h3>Results: " + res.summary.success + "/" + res.summary.total + " successful</h3>" +
              res.results.map(r => "<div class='result-item " + r.status + "'>" + (r.status === "success" ? "✓" : "✗") + " " + r.file +
                (r.error ? " - " + r.error : "") + "</div>").join("");
            if (res.summary.failed === 0) selectedFiles.clear();
            updateSelectedFilesList();
            loadFiles(currentPath, isAbsolute);
          } else {
            results.innerHTML = "<div class='status error'>" + (res.error || "Upload failed") + "</div>";
          }
        }

        async function disconnect() {
          await api("disconnect", "POST");
          location.reload();
        }

        function showStatus(id, msg, type) {
          document.getElementById(id).innerHTML = "<div class='status " + type + "'>" + msg + "</div>";
        }
      </script>
    </body>
    </html>'''

