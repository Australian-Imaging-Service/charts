{{- /* Rendered whenever enabled; a missing SPO is caught by validate.yaml. */ -}}
{{- if and .Values.security.enabled .Values.security.seccomp.enabled }}
{{- /*
SeccompProfile CR (security-profiles-operator). defaultAction SCMP_ACT_LOG
audit-logs (rather than blocks) any syscall not in the allow list, so this
profile is observe-only and safe to attach without breaking workloads. The SPO
node daemon writes the JSON profile under the kubelet seccomp root as
operator/<name>.json; singleuser pods reference it via
jupyterhub.singleuser.extraPodConfig. CLUSTER-scoped (SPO 1.0.0 CRD): no namespace.
*/ -}}
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: SeccompProfile
metadata:
  name: {{ .Values.security.seccomp.profileName }}
  labels:
    {{- include "neurodesk.labels" . | nindent 4 }}
spec:
  architectures: [ SCMP_ARCH_X86_64 ]
  defaultAction: SCMP_ACT_LOG
  syscalls:
  - action: SCMP_ACT_ALLOW
    names: [ accept, accept4, access, bind, brk, capget, capset, chdir, chmod, chown, chroot, clock_gettime, clock_nanosleep, clone, clone2, clone3, close, connect, creat, dup, dup2, dup3, epoll_create, epoll_create1, epoll_ctl, epoll_pwait, epoll_wait, eventfd, eventfd2, execve, exit, exit_group, faccessat, faccessat2, fadvise64, fallocate, fchdir, fchmod, fcntl, fdatasync, flock, fstat, fstatfs, fsync, ftruncate, futex, getcwd, getdents, getdents64, getegid, geteuid, getgid, getgroups, getpeername, getpgrp, getpid, getppid, getpriority, getrandom, getresgid, getresuid, getrlimit, getsockname, getsockopt, gettid, getuid, inotify_add_watch, inotify_init, inotify_init1, inotify_rm_watch, ioctl, kill, link, listen, lseek, lstat, madvise, memfd_create, mkdir, mkdirat, mmap, mount, mprotect, mremap, msync, munmap, name_to_handle_at, nanosleep, newfstatat, open, openat, pause, pipe, pipe2, pivot_root, poll, ppoll, prctl, pread, pread64, prlimit64, pselect6, pwrite64, read, readlink, readlinkat, recvfrom, recvmsg, rename, rmdir, rt_sigaction, rt_sigprocmask, rt_sigreturn, sched_getaffinity, sched_getattr, sched_get_priority_max, sched_get_priority_min, sched_setaffinity, sched_setattr, sched_setscheduler, sched_yield, seccomp, sendmsg, sendto, sethostname, setpgid, setpriority, setresuid, set_robust_list, setsid, setsockopt, set_tid_address, shmat, shmctl, shmdt, shmget, shutdown, sigaltstack, socket, socketpair, stat, statfs, statx, symlink, symlinkat, tee, tgkill, umask, umount, umount2, uname, unlink, unshare, vfork, wait4, waitid, waitpid, write, writev ]
{{- end }}
