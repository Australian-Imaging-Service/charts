{{- if and .Values.jupyterhub.enabled .Values.jupyterGlue.homeResize.enabled .Values.jupyterGlue.homeResize.rbac }}
{{- /*
RBAC the Hub uses for automatic home-PVC resize. The spawner-side reconcile
loop (in jupyterhub.hub.extraConfig, delivered via the examples overlay) reads
PVC usage from Prometheus and patches the singleuser home PVCs' requested size.
The init-Job verbs cover the shared permission-init Jobs the loop also drives.

The subject is the z2jh Hub ServiceAccount. z2jh names it via its own
`jupyterhub.hub.fullname` helper, which is out of scope in this parent chart, so
we resolve `.Values.jupyterhub.hub.serviceAccount.{create,name}` directly with
the same defaulting (default name "hub"). Override under jupyterhub.hub.* if you
rename it.
*/}}
{{- $hubValues := default (dict) .Values.jupyterhub.hub }}
{{- $serviceAccount := default (dict) $hubValues.serviceAccount }}
{{- $saName := "" }}
{{- if (default true $serviceAccount.create) }}
{{- $saName = default "hub" $serviceAccount.name }}
{{- else }}
{{- $saName = default "default" $serviceAccount.name }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-resize
  namespace: {{ include "neurodesk.namespace" . }}
  labels:
    {{- include "neurodesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: home-resize
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-resize
  namespace: {{ include "neurodesk.namespace" . }}
  labels:
    {{- include "neurodesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: home-resize
subjects:
- kind: ServiceAccount
  name: {{ $saName }}
  namespace: {{ include "neurodesk.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-resize
{{- end }}
