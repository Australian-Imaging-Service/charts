apiVersion: v2
name: ais
description: Australian Imaging Service overarching chart
maintainers:
  - name: ais-admin
    email: ais-admin@sydney.edu.au
type: application
version: 2.0.0
appVersion: 1.0.0 

dependencies:
  - name: xnat
    condition: xnat.enabled
    version: "~2.0.0"
    repository: "file://../xnat"
  - name: ctp
    condition: ctp.enabled
    version: "~1.1.0"
    repository: "file://../ctp"
  # Neurodesk: JupyterHub + neurodesktop notebooks + CVMFS + FUSE + AppArmor
  # (bundled Security Profiles Operator), wired to the XNAT above. Replaces
  # the plain `jupyterhub` dependency of ais 1.x.
  - name: neurodesk
    condition: neurodesk.enabled
    version: "~0.3.0"
    repository: "file://../neurodesk"
