apiVersion: v2
name: ais
description: Australian Imaging Service overarching chart
maintainers:
  - name: ais-admin
    email: ais-admin@sydney.edu.au
type: application
version: 1.0.1
appVersion: 1.0.0 

dependencies:
  - name: xnat
    condition: xnat.enabled
    version: "~2.0.0"
    repository: "file://../xnat"
  - name: ctp
    condition: ctp.enabled
    version: "~1.1.0"
    repository: "file://../ctp"
  - name: jupyterhub-xnat
    condition: jupyterhub-xnat.enabled
    version: "0.1.0"
    repository: "file://../jupyterhub-xnat"
  - name: cvmfs-csi
    condition: cvmfs-csi.enabled
    version: "2.3.0"
    repository: "https://registry.cern.ch/chartrepo/cern"
  - name: smarter-device-manager
    condition: smarter-device-manager.enabled
    version: "0.0.10"
    repository: "https://smarter-project.github.io/smarter-device-manager/"
  - name: gpu-operator
    condition: gpu-operator.enabled
    version: "v25.10.1"
    repository: "https://nvidia.github.io/gpu-operator"
  - name: security-profiles-operator
    condition: security-profiles-operator.enabled
    version: "0.10.1-dev"
    repository: "file://../security-profiles-operator"
